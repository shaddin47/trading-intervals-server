# market_groups.yaml
# ──────────────────────────────────────────────────────────────────────────
# Override configuration for Trading Intervals Monitor market group display rows.
#
# The base list of RouteGroupIDs and Names comes from the SQL query:
#   SELECT ID, Name FROM RouteGroup WHERE Name NOT LIKE 'UNUSED%'
#
# This file supplies:
#   - Multiple display rows per RouteGroupID (e.g. ICE UK / ICE ENDEX / ICE US
#     all share RouteGroupID 5 but filter by different ExchangeKeysCSV)
#   - TaskName aliases (semicolon-separated) for matching scheduled tasks
#   - exchange_keys_csv: comma-separated exchange key filter
#   - exchange_keys_from_viable_routes: use viable routes instead of fixed keys
#   - ignore: hide this row from the Gantt display
#   - comment: shown in tooltip on hover (per-group, all intervals)
#
# RouteGroupIDs not listed here get a single default row using the DB name.
# ──────────────────────────────────────────────────────────────────────────

