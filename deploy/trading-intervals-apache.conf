# ============================================================
# Apache configuration for trading-intervals
#
# Architecture:
#   - Apache serves the React SPA from /usr/local/trading-intervals
#   - Apache proxies /trading-intervals-server/ → uvicorn @ 127.0.0.1:3000
#
# Install (RHEL/CentOS — httpd):
#   sudo cp trading-intervals-apache.conf \
#       /etc/httpd/conf.d/trading-intervals.conf
#   sudo systemctl reload httpd
#
# Required modules (enable via httpd.conf or conf.modules.d/):
#   mod_proxy  mod_proxy_http  mod_rewrite  mod_headers  mod_ssl
# ============================================================

# ── HTTP: redirect everything to HTTPS ───────────────────────────────────────
<VirtualHost *:80>
    ServerName trading-intervals.prod.cqg
    #ServerName ch3lgl-vscotthdev.stage.cqg
    RewriteEngine On
    RewriteRule ^/?(.*) https://trading-intervals.prod.cqg/$1 [R=301,L]
    #RewriteRule ^/?(.*) https://ch3lgl-vscotthdev.stage.cqg/$1 [R=301,L]
</VirtualHost>

# ── HTTPS ────────────────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName trading-intervals.prod.cqg
    #ServerName ch3lgl-vscotthdev.stage.cqg

    # ── SSL ────────────────────────────────────────────────────────────────
    SSLEngine on
    #SSLCertificateFile    /etc/pki/tls/certs/trading-intervals.crt
    #SSLCertificateKeyFile /etc/pki/tls/private/trading-intervals.key
    SSLCertificateFile /etc/pki/tls/certs/prod.cqg.crt
    SSLCertificateKeyFile /etc/pki/tls/prod.cqg.key
    # If your CA provides a chain file:
    # SSLCertificateChainFile /etc/pki/tls/certs/trading-intervals-chain.crt

    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:\
ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:\
ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:\
DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # ── Security headers ───────────────────────────────────────────────────
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"

    # ── React SPA — served directly by Apache ─────────────────────────────
    DocumentRoot "/usr/local/trading-intervals"

    <Directory "/usr/local/trading-intervals">
        Options None
        AllowOverride None
        Require all granted
        Options +FollowSymLinks
        RewriteEngine On
        # Serve existing files and directories as-is (JS/CSS/images/etc.)
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
        RewriteRule ^ - [L]
        # All other requests → index.html (React Router handles routing)
        RewriteRule ^ /index.html [L]
    </Directory>

    # ── Backend API proxy ──────────────────────────────────────────────────
    # Strips the /trading-intervals-server prefix before forwarding to uvicorn,
    # so /trading-intervals-server/api/intervals → http://127.0.0.1:3000/api/intervals
    ProxyRequests Off
    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For  "%{REMOTE_ADDR}s"

    ProxyPass        "/trading-intervals-server/" "http://127.0.0.1:3002/"
    ProxyPassReverse "/trading-intervals-server/" "http://127.0.0.1:3002/"

    ProxyTimeout 120
    Timeout      120

    <Proxy *>
        Require all granted
    </Proxy>

    # ── Logging ────────────────────────────────────────────────────────────
    ErrorLog  /var/log/httpd/trading-intervals-error.log
    CustomLog /var/log/httpd/trading-intervals-access.log combined

</VirtualHost>

